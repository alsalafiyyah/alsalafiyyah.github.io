- name: "Ibn al-Qayyim"
  source: "I'lam al-Muwa'qqi'in 'an Rabb al-Alamin (4/90)"
  eng: "Chapter: Regarding the permissibility of issuing legal verdicts (fatwa) based upon Salafi narrations and the legal verdicts of the Companions, and that they are more worthy of being adopted than the opinions and verdicts of later generations; that their proximity to correctness is in accordance with the proximity of their proponents to the era of the Messenger — prayers and peace of Allah be upon him and his family; that the verdicts of the Companions are more worthy of being followed than the verdicts of the Successors (Tabi'in), and the verdicts of the Successors are more worthy than those of the followers of the Successors, and so on. Whenever the era is closer to the Messenger, correctness is more prevalent. This is a general rule concerning categories/types rather than every single individual matter, just as the era of the Successors, even though it is superior to the era of those who followed them, is superior in a general sense rather than for every individual person. However, those possessing excellence in the earlier era are more numerous than those in the later era, and likewise, correctness in their statements is more prevalent than correctness in the statements of those who came after them. Indeed, the disparity between the knowledge of the predecessors and that of the later generations is like the disparity between them in virtue and religion."
  ar: " فصل: في جواز الفتوى بالآثار السلفية والفتاوي الصحابية، وأنها أولى بالأخذ بها من آراء المتأخرين وفتاويهم، وأن قربها إلى الصواب بحسب قرب أهلها من عصر الرسول صلوات الله وسلامه عليه وعلى آله، وأن فتاوى الصحابة أولى أن يؤخذ بها من فتاوى التابعين، وفتاوى التابعين أولى من فتاوى تابعي التابعين، وهلم جرا، وكلما كان العهد بالرسول أقرب كان الصواب أغلب، وهذا حكم بحسب الجنس لا بحسب كل فرد فرد من المسائل، كما أن عصر التابعين، وإن كان أفضل من عصر تابعيهم فإنما هو بحسب الجنس لا بحسب كل شخص شخص، ولكن المفضلون في العصر المتقدم أكثر من المفضلين في العصر المتأخر، وهكذا الصواب في أقوالهم أكثر من الصواب في أقوال من بعدهم؛ فإن التفاوت بين علوم المتقدمين والمتأخرين كالتفاوت الذي بينهم في الفضل والدين."

- name: "Shaykh al-Islam Ibn Taymiyyah"
  source: "Majmu' al-Fatawa 4/149"
  eng: "There is no blame on one who manifests the madhdhab of the Salaf, affiliates with it, and takes pride in it; rather, accepting that from him is obligatory by consensus."
  ar: "لا عيب على من أظهر مذهب السلف وانتسب إليه واعتزى إليه بل يجب قبول ذلك منه بالاتفاق."