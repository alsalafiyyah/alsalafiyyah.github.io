---
layout: page
title: "Gems"
permalink: /gems/
---

<div id="gems-container" class="space-y-4" data-per-page="8">
  {% for g in site.gems %}
  <article class="gem-item group block border-b border-black/10 dark:border-white/10 hover:border-black dark:hover:border-white transition-colors duration-300 py-4 first:pt-0 last:border-b-0 hidden">
      <a href="{{ g.url | relative_url }}" class="flex flex-col gap-1 w-full">
          
          {% if g.author %}
          <div class="text-[10px] font-black uppercase tracking-[0.2em] text-zinc-400 dark:text-zinc-500">
              {{ g.author }}
          </div>
          {% endif %}

          <h3 class="text-lg md:text-xl font-black uppercase tracking-tighter serif text-black dark:text-white group-hover:underline decoration-2 underline-offset-4 leading-tight">
              {{ g.title }}
          </h3>

          <p class="text-xs md:text-sm font-medium leading-relaxed text-zinc-500 dark:text-zinc-400 line-clamp-2">
              {{ g.summary }}
          </p>

          <div class="pt-1">
              <span class="text-[10px] font-black uppercase tracking-widest text-black dark:text-white flex items-center gap-1 group-hover:text-red-500 transition-colors">
                  Continue Reading →
              </span>
          </div>
      </a>
  </article>
  {% endfor %}
</div>

<!-- Pagination Controls -->
<nav id="pagination-nav" class="flex justify-between items-center mt-8 pt-4 border-t border-black/10 dark:border-white/10 text-xs font-black uppercase tracking-widest hidden">
  <button id="prev-btn" onclick="changePage(-1)" class="hover:text-red-500 transition-colors cursor-pointer disabled:text-zinc-300 dark:disabled:text-zinc-700 disabled:cursor-not-allowed">
    ← Newer
  </button>

  <div id="page-info" class="text-zinc-400">
    Page 1 of 1
  </div>

  <button id="next-btn" onclick="changePage(1)" class="hover:text-red-500 transition-colors cursor-pointer disabled:text-zinc-300 dark:disabled:text-zinc-700 disabled:cursor-not-allowed">
    Older →
  </button>
</nav>

<!-- JavaScript Pagination Logic -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const container = document.getElementById("gems-container");
    const items = Array.from(container.getElementsByClassName("gem-item"));
    const perPage = parseInt(container.getAttribute("data-per-page")) || 5;
    let currentPage = 1;
    const totalPages = Math.ceil(items.length / perPage);

    if (totalPages > 1) {
      document.getElementById("pagination-nav").classList.remove("hidden");
    }

    window.changePage = function (direction) {
      currentPage += direction;
      showPage(currentPage);
    };

    function showPage(page) {
      if (page < 1 || page > totalPages) return;
      currentPage = page;

      const start = (currentPage - 1) * perPage;
      const end = start + perPage;

      items.forEach((item, index) => {
        if (index >= start && index < end) {
          item.classList.remove("hidden");
        } else {
          item.classList.add("hidden");
        }
      });

      document.getElementById("page-info").innerText = `Page ${currentPage} of ${totalPages}`;
      document.getElementById("prev-btn").disabled = currentPage === 1;
      document.getElementById("next-btn").disabled = currentPage === totalPages;
    }

    showPage(1);
  });
</script>
