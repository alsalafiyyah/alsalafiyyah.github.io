layout: page
permalink: /view/
---

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<div id="content">Loading...</div>

    <script>
        // Get the 'file' query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        if (fileName) {
            // Fetch the raw markdown file from your posts/directory
            fetch(`/_posts/${fileName}`) // Adjust path to where your files live
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(markdown => {
                    // Optional: Strip Jekyll frontmatter if present using regex
                    const cleanMarkdown = markdown.replace(/^---[\s\S]*?---/, '');
                    
                    // Render into HTML
                    document.getElementById('content').innerHTML = marked.parse(cleanMarkdown);
                })
                .catch(error => {
                    document.getElementById('content').innerHTML = `<p>Error loading file: ${error.message}</p>`;
                });
        } else {
            document.getElementById('content').innerHTML = '<p>No file specified in the URL.</p>';
        }
    </script>
