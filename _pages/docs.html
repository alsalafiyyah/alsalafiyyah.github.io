---
layout: page
title: "Docs"
permalink: /docs/
---

<div id="gems-container" class="space-y-4">
  {% for g in site.gems %}
          <article class="gem-item">
              <div class="flex justify-between items-center mb-5 text-gray-500">
                  <span class="bg-primary-100 text-primary-800 text-xs font-medium inline-flex items-center px-2.5 py-0.5 rounded dark:bg-primary-200 dark:text-primary-800">
                      <svg class="mr-1 w-3 h-3" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"></path></svg>
                      Gems
                  </span>
                  <span class="text-sm"></span>
              </div>
              <h2 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white"><a href="{{ g.url | relative_url }}">{{ g.title }}</a></h2>
              <p class="mb-5 font-light text-gray-500 dark:text-gray-400">{{ g.summary }}</p>
              <div class="flex justify-between items-center">
                  <div class="flex items-center space-x-4">
                     {% if g.author %}
                      <span class="font-medium dark:text-white">
                          {{ g.author }}
                      </span>
                     {% endif %}
                  </div>
                  <a href="{{ g.url | relative_url }}" class="inline-flex items-center font-medium text-primary-600 dark:text-primary-500 hover:underline">
                      Read more
                      <svg class="ml-2 w-4 h-4" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                  </a>
              </div>
          </article> 
  {% endfor %}
</div>

<!-- Pagination Controls -->
<nav id="pagination-nav" class="flex justify-between items-center mt-8 pt-4 border-t border-black/10 dark:border-white/10 text-xs font-black uppercase tracking-widest hidden">
  <a id="prev-btn" href="#" class="hover:text-red-500 transition-colors">
    ← Newer
  </a>

  <div id="page-info" class="text-zinc-400">
    Page 1 of 1
  </div>

  <a id="next-btn" href="#" class="hover:text-red-500 transition-colors">
    Older →
  </a>
</nav>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const container = document.getElementById("gems-container");
    const items = Array.from(container.getElementsByClassName("gem-item"));
    const perPage = 10; 
    
    const urlParams = new URLSearchParams(window.location.search);
    let currentPage = parseInt(urlParams.get('page')) || 1;
    const totalPages = Math.ceil(items.length / perPage);

    if (currentPage < 1) currentPage = 1;
    if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;

    const start = (currentPage - 1) * perPage;
    const end = start + perPage;

    items.forEach((item, index) => {
      if (index >= start && index < end) {
        item.classList.remove("hidden");
      }
    });

    if (totalPages > 1) {
      const nav = document.getElementById("pagination-nav");
      nav.classList.remove("hidden");

      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      const pageInfo = document.getElementById("page-info");

      pageInfo.innerText = `Page ${currentPage} of ${totalPages}`;

      // Handle Newer Button
      if (currentPage > 1) {
        prevBtn.href = `?page=${currentPage - 1}`;
      } else {
        prevBtn.classList.add("text-zinc-300", "dark:text-zinc-700", "pointer-events-none");
      }

      // Handle Older Button
      if (currentPage < totalPages) {
        nextBtn.href = `?page=${currentPage + 1}`;
      } else {
        nextBtn.classList.add("text-zinc-300", "dark:text-zinc-700", "pointer-events-none");
      }
    }
  });
</script>
