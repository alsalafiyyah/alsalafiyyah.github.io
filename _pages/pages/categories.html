---
layout: no_sidebar
title: "Site Categories"
permalink: /category/
summary: ""
---

            <div class="flex flex-col justify-between bg-white dark:bg-black group transition-all flex-shrink-0">
                <span class="text-[10px] font-black uppercase tracking-widest opacity-50 group-hover:opacity-100">Page</span>
                <div>
                    <h4 class="text-2xl font-black uppercase tracking-tighter serif mb-1">{{ page.title }}</h4>
                </div>
            </div>

<section class="mb-10">
    <div class="transition-colors duration-300">

        <!-- Section Header & Filter Input -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8 border-b-2 border-black/10 dark:border-white/10 pb-6">
            <div class="flex items-center gap-4 text-[10px] font-black uppercase tracking-[0.3em] text-gray-400 italic">
                <span class="w-2 h-2 rounded-full bg-red-500 flex-shrink-0 mr-2.5"></span>
                <span class="text-black dark:text-white">{{ site.categories.size }} Categories</span>
            </div>
            <!-- Search Filter Bar -->
            <div class="w-full md:w-72">
                <input type="text" id="category-search" placeholder="Filter categories..." class="w-full bg-gray-50 dark:bg-zinc-900 border-2 border-black/20 dark:border-white/20 px-4 py-2 text-xs font-bold text-black dark:text-white outline-none focus:border-black dark:focus:border-white transition-colors">
            </div>
        </div>
    
        <div id="categories-directory-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 max-h-[450px] overflow-y-auto pr-2 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:bg-black/20 dark:[&::-webkit-scrollbar-thumb]:bg-white/20">
            <!-- Category Item -->
            {% for cat in site.categories %}
            <a href="/category/{{ cat.category | slugify }}" class="category-item flex justify-between items-center p-3 border border-black/10 dark:border-white/10 bg-gray-50/50 dark:bg-zinc-900/50 hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-all group">
                <span class="text-xs font-bold uppercase tracking-wide">{{ cat.title }}</span>
                <span class="text-[10px] font-black px-2 py-0.5 bg-black/10 dark:bg-white/10 group-hover:bg-white group-hover:text-black dark:group-hover:bg-black dark:group-hover:text-white transition-colors">{{ cat.category.size }}</span>
            </a>
            {% endfor %}
        </div>

     </div>
</section>
