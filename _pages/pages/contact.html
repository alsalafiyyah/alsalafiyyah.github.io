---
layout: page
title: Contact Us
permalink: /contact/
summary: "Collection of translated articles and lectures from scholars of the Sunnah."
---
<div class="p-8 mb-6 border-4 border-black dark:border-white bg-white dark:bg-zinc-950 transition-colors max-w-2xl mx-auto">
    <div class="mb-6">
        <span class="text-[10px] font-black uppercase tracking-[0.2em] block text-gray-400">Get in Touch</span>
        <h3 class="text-2xl font-bold italic serif dark:text-white">Contact Us</h3>
    </div>

    <form id="contactForm" action="https://script.google.com/macros/s/AKfycbzTpoC9s5RgDK2xS0AfsCusfyWX4UPowJwxl-xqDtprJreJhMoR8kaX_KGgqrhcTa1i/exec" method="POST" class="space-y-5">
        
        <div class="form-group flex flex-col gap-1.5">
            <label for="name" class="text-[11px] font-black uppercase tracking-wider text-black dark:text-white">Name</label>
            <input type="text" id="name" name="name" required 
                   class="w-full p-3 border-2 border-black dark:border-white bg-transparent text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white transition-all font-medium text-sm">
        </div>

        <div class="form-group flex flex-col gap-1.5">
            <label for="email" class="text-[11px] font-black uppercase tracking-wider text-black dark:text-white">Email</label>
            <input type="email" id="email" name="email" required 
                   class="w-full p-3 border-2 border-black dark:border-white bg-transparent text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white transition-all font-medium text-sm">
        </div>

        <div class="form-group flex flex-col gap-1.5">
            <label for="message" class="text-[11px] font-black uppercase tracking-wider text-black dark:text-white">Message</label>
            <textarea id="message" name="message" rows="4" required 
                      class="w-full p-3 border-2 border-black dark:border-white bg-transparent text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white transition-all font-medium text-sm resize-none"></textarea>
        </div>

        <button type="submit" id="submitBtn" 
                class="w-full py-3.5 px-6 bg-black text-white dark:bg-white dark:text-black font-black uppercase tracking-[0.15em] text-xs hover:opacity-80 disabled:opacity-50 transition-all focus:outline-none cursor-pointer">
            Send Message
        </button>
    </form>

    <!-- Status Message Display -->
    <div id="status-msg" class="mt-4 text-xs font-bold uppercase tracking-wider hidden p-3 border-2"></div>
</div>

<script>
    const form = document.getElementById('contactForm');
    const statusMsg = document.getElementById('status-msg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerText = "Sending...";
        
        // Show status badge
        statusMsg.classList.remove('hidden', 'border-green-600', 'text-green-600', 'border-red-600', 'text-red-600');
        statusMsg.classList.add('border-black', 'dark:border-white', 'text-black', 'dark:text-white');
        statusMsg.textContent = "Sending your message...";

        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            statusMsg.classList.remove('border-black', 'dark:border-white', 'text-black', 'dark:text-white');
            
            if(data.result === 'success') {
                statusMsg.textContent = "Thank you! Your message was sent successfully.";
                statusMsg.classList.add('border-green-600', 'text-green-600', 'bg-green-50', 'dark:bg-green-950/30');
                form.reset();
            } else {
                statusMsg.textContent = "Error submitting data: " + (data.error || "Unknown error");
                statusMsg.classList.add('border-red-600', 'text-red-600', 'bg-red-50', 'dark:bg-red-950/30');
            }
        })
        .catch(error => {
            statusMsg.classList.remove('border-black', 'dark:border-white', 'text-black', 'dark:text-white');
            statusMsg.textContent = "Submission error. Check web app permissions.";
            statusMsg.classList.add('border-red-600', 'text-red-600', 'bg-red-50', 'dark:bg-red-950/30');
            console.error('Error:', error);
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Send Message";
        });
    });
</script>
