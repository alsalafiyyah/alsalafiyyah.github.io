---
layout: page
title: "Scholar Biographies"
active: biography
permalink: /biography/
summary: "Biography of Imams and scholars of the Sunnah who stood firm upon the creed of the Salaf and preserving the authentic Sunnah."
---

<div id="scholar-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

<!-- Pagination Controls -->
<nav id="pagination-nav" class="flex items-center justify-between border-t-4 border-black dark:border-white pt-12 mt-12 mb-24">
  <a id="prev-link" href="#" class="text-sm font-black uppercase tracking-widest hover:line-through invisible">← Newer</a>
  
  <div class="text-sm font-black uppercase tracking-widest tabular-nums">
    <span id="current-page-display">01</span> / <span id="total-pages-display">01</span>
  </div>
  
  <a id="next-link" href="#" class="text-sm font-black uppercase tracking-widest hover:line-through invisible">Older →</a>
</nav>

<script id="scholar-data" type="application/json">
[
  {% assign items = site.biography %}
  {% for item in items %}
    {% assign fallback_summary = item.content | strip_html | truncatewords: 20 %}
    {% assign summary_text = item.excerpt | default: fallback_summary %}
    {
      "title": {{ item.title | jsonify }},
      "url": {{ item.url | jsonify }},
      "date": {{ item.date | date: "%Y-%m-%d" | jsonify }},
      "hijri": {{ item.hijri | jsonify }},
      "country": {{ item.country | jsonify }},
      "summary": {{ summary_text | jsonify }},
      "official_web": {% if item.official_web %}{{ item.official_web | jsonify }}{% else %}[]{% endif %},
      "fatwa_url": {{ item.fatwa_url | jsonify }}
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('scholar-container');
  const dataScript = document.getElementById('scholar-data');

  if (!container) {
    console.error('Scholar Container (#scholar-container) not found in DOM.');
    return;
  }

  if (!dataScript) {
    console.error('Scholar Data script (#scholar-data) not found in DOM.');
    return;
  }

  let scholars = [];
  try {
    scholars = JSON.parse(dataScript.textContent.trim());
  } catch (err) {
    console.error('Failed to parse scholar JSON data:', err);
    container.innerHTML = `<p class="p-4 border-2 border-red-500 text-red-500 font-mono text-xs">JSON Parse Error: Check Browser Console for details.</p>`;
    return;
  }

  if (!scholars.length) {
    container.innerHTML = `<p class="p-4 border-2 border-black dark:border-white font-mono text-xs">No biographies found in site.biography collection.</p>`;
    return;
  }

  container.innerHTML = scholars.map(scholar => {
    // Safely parse web links array
    const links = Array.isArray(scholar.official_web) ? scholar.official_web : [];
    const webLinks = links.map(link => `
      <a href="${link.url}" target="_blank" rel="noopener noreferrer" 
         class="inline-flex items-center gap-1 text-xs font-bold uppercase tracking-wider underline hover:no-underline">
         🌐 ${link.title || link.url}
      </a>
    `).join(' ');

    return `
      <article class="border-2 border-black dark:border-white p-6 bg-white dark:bg-neutral-900 flex flex-col justify-between shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)]">
        <div>
          <div class="flex items-center justify-between gap-2 text-xs font-mono uppercase tracking-widest text-neutral-600 dark:text-neutral-400 mb-2">
            <span>${scholar.country || 'Scholar'}</span>
            <span>${scholar.hijri || ''}</span>
          </div>

          <h2 class="text-2xl font-black tracking-tight mb-3">
            <a href="${scholar.url || '#'}" class="hover:underline">${scholar.title || 'Untitled'}</a>
          </h2>

          <p class="text-sm text-neutral-700 dark:text-neutral-300 leading-relaxed mb-6">
            ${scholar.summary || ''}
          </p>

          ${webLinks ? `<div class="mb-6 pt-4 border-t border-neutral-200 dark:border-neutral-800 flex flex-wrap gap-3">${webLinks}</div>` : ''}
        </div>

        <div class="flex items-center gap-3 pt-4 border-t-2 border-black dark:border-white">
          <a href="${scholar.url || '#'}" 
             class="flex-1 text-center py-2 px-3 text-xs font-black uppercase tracking-wider bg-black text-white dark:bg-white dark:text-black hover:opacity-80 transition-opacity">
            Read Biography
          </a>
          
          ${scholar.fatwa_url ? `
            <a href="${scholar.fatwa_url}" 
               class="flex-1 text-center py-2 px-3 text-xs font-black uppercase tracking-wider border border-black dark:border-white hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors">
              See Fatwas
            </a>
          ` : ''}
        </div>
      </article>
    `;
  }).join('');
});
</script>
