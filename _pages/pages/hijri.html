<div class="max-w-4xl mx-auto p-4 font-sans">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
        
        <!-- Islamic Date Converter Widget -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm w-full transition-colors duration-200 border border-gray-100 dark:border-slate-700">
            <label for="gregorianPicker" class="block text-sm font-semibold mb-2 text-slate-800 dark:text-slate-100">Islamic Date Converter</label>
            <input type="date" id="gregorianPicker" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4">
            <div class="space-y-1 text-sm border-t border-slate-200 dark:border-slate-700 pt-3">
                <div class="flex justify-between">
                    <span class="text-slate-500 dark:text-slate-400">Date:</span> 
                    <span id="gregorianOutput" class="font-medium text-slate-800 dark:text-slate-100">-</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-500 dark:text-slate-400">Hijri:</span> 
                    <span id="hijriOutput" class="font-medium text-slate-800 dark:text-slate-100">-</span>
                </div>
            </div>
        </div>

    </div>
</div>
    <script>
        const picker = document.getElementById('gregorianPicker');
        const gregorianOutput = document.getElementById('gregorianOutput');
        const hijriOutput = document.getElementById('hijriOutput');

        // Set default to today's date
        const today = new Date();
        const isoToday = today.toISOString().split('T')[0];
        picker.value = isoToday;
        updateDates(today);

        // Listen for changes when the user picks a date
        picker.addEventListener('change', function(e) {
            if (e.target.value) {
                // Parse local date safely without timezone shifting issues
                const [year, month, day] = e.target.value.split('-').map(Number);
                const selectedDate = new Date(year, month - 1, day);
                updateDates(selectedDate);
            }
        });

        function updateDates(dateObj) {
            // Display Gregorian
            gregorianOutput.textContent = dateObj.toISOString().split('T')[0];

            // Convert and Display Hijri (Umm al-Qura)
            const hijriFormatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });

            const parts = hijriFormatter.formatToParts(dateObj);
            let hYear = '', hMonth = '', hDay = '';

            parts.forEach(part => {
                if (part.type === 'year') hYear = part.value;
                if (part.type === 'month') hMonth = part.value;
                if (part.type === 'day') hDay = part.value;
            });

            hijriOutput.textContent = `${hYear}-${hMonth}-${hDay}`;
        }
    </script>
