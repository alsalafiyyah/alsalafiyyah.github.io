---
permalink: manifest.json
layout: null
content-type: application/manifest+json
---

{
  "$schema": "https://json.schemastore.org/web-manifest-combined.json",
  "lang": "{{ site.manifest_lang }}",
  "background_color": "{{ site.manifest_bg_color }}",
  "theme_color": "{{ site.manifest_bg_color }}",
  "name": "{{ site.manifest_name }}",
  "short_name": "{{ site.manifest_name }}",
  "start_url": "/",
  "display": "{{ site.manifest_display }}",
  "description": "{{ site.manifest_desc }}",
  "icons": [
    {
      "src": "{{ '/assets/icons/web-app-manifest-192x192.png' | absolute_url }}",
      "sizes": "192x192",
      "type": "image/png",
      "purpose": "maskable"
    },
    {
      "src": "{{ '/assets/icons/web-app-manifest-512x512.png' | absolute_url }}",
      "sizes": "512x512",
      "type": "image/png",
      "purpose": "maskable"
    }
  ]
}
