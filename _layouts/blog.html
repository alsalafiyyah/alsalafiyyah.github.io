---
layout: no_sidebar
---

<div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="fatwa-container">
    <!-- Dynamic content populated via script or liquid posts -->
</div>

<nav id="pagination-nav" class="flex items-center justify-between border-t-4 border-black dark:border-white pt-12 mt-12 mb-3">
    {% if page.pager.previous_page %}
        <a id="prev-link" href="{% if page.pager.previous_page == 1 %}/{% else %}/blog/{{ page.pager.previous_page }}/{% endif %}" class="text-sm font-black uppercase tracking-widest hover:line-through">← Newer</a>
    {% else %}
        <a id="prev-link" href="#" class="text-sm font-black uppercase tracking-widest hover:line-through invisible">← Newer</a>
    {% endif %}

    <div class="text-sm font-black uppercase tracking-widest tabular-nums">
        Page <span id="current-page-display">{{ page.pager.current_page }}</span> of <span id="total-pages-display">{{ page.pager.total_pages }}</span>
    </div>

    {% if page.pager.next_page %}
        <a id="next-link" href="/blog/{{ page.pager.next_page }}/" class="text-sm font-black uppercase tracking-widest hover:line-through">Older →</a>
    {% else %}
        <a id="next-link" href="#" class="text-sm font-black uppercase tracking-widest hover:line-through invisible">Older →</a>
    {% endif %}
</nav>

<script id="fatwa-data" type="application/json">
[
  {% for post in page.pager.posts %}
    {
      "title": {{ post.title | jsonify }},
      "url": {{ post.url | jsonify }},
      "date": {{ post.date | date: "%Y-%m-%d" | jsonify }},
      "hijri": {{ post.hijri | jsonify }},
      "audio": {{ post.mp3 | jsonify }},
      "videoID": {{ post.videoID | jsonify }},
      "summary": {{ post.content | strip_html | truncatewords: 20 | jsonify }}
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>
