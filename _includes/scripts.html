<script>
document.addEventListener("DOMContentLoaded", function () {
    const allTemplates = Array.from(document.querySelectorAll("#allPosts .post-template"));
    const container = document.getElementById("searchResults");
    const paginationNav = document.getElementById("paginationNav");
    const termDisplay = document.getElementById("search-term-display");
    const countDisplay = document.getElementById("result-count");

    const pageSize = 10; 

    function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name) || "";
    }

    function getUrlPage() {
        const params = new URLSearchParams(window.location.search);
        return parseInt(params.get('page')) || 1;
    }

    function highlightText(text, query) {
        if (!query) return text;
        const regex = new RegExp(`(${query})`, "gi");
        // Using a custom class for the highlight to match theme
        return text.replace(regex, `<mark class="bg-black text-white dark:bg-white dark:text-black p-0.5">$1</mark>`);
    }

    function extractSnippet(content, query, length = 100) {
        const contentLower = content.toLowerCase();
        const queryLower = query.toLowerCase();
        const index = contentLower.indexOf(queryLower);
        if (index === -1) return content.slice(0, length * 2) + "...";

        const start = Math.max(0, index - length);
        const end = Math.min(content.length, index + query.length + length);
        let snippet = content.slice(start, end).trim();
        if (start > 0) snippet = "..." + snippet;
        if (end < content.length) snippet = snippet + "...";
        return highlightText(snippet, query);
    }

    function renderPosts() {
        const query = getQueryParam('q').trim();
        const queryLower = query.toLowerCase();
        termDisplay.innerText = query || "{{ site.site_elements.all_entries }}";

        const filtered = allTemplates.filter(post => {
            const title = post.dataset.title.toLowerCase();
            const content = post.dataset.content.toLowerCase();
            return title.includes(queryLower) || content.includes(queryLower);
        });

        countDisplay.innerText = filtered.length < 10 ? `0${filtered.length}` : filtered.length;

        const totalPages = Math.ceil(filtered.length / pageSize);
        let currentPage = getUrlPage();
        if (currentPage > totalPages) currentPage = totalPages || 1;

        const paginated = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);

        if (paginated.length) {
            container.innerHTML = paginated.map(post => `
                <article class="group py-4 border-b border-gray-100 dark:border-zinc-800 last:border-0">
                    <span class="text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400">
                        ${post.dataset.hijri}
                    </span>
                    <h2 class="text-3xl md:text-4xl font-black mt-2 mb-6 leading-[0.85] uppercase tracking-tighter group-hover:italic transition-all">
                        <a href="${post.dataset.url}">${highlightText(post.dataset.title, query)}</a>
                    </h2>
                    <p class="text-lg text-gray-600 dark:text-zinc-400 leading-relaxed max-w-2xl">
                        ${extractSnippet(post.dataset.content, query)}
                    </p>
                </article>
            `).join('');
        } else {
            container.innerHTML = `<p class="py-20 text-xl font-bold opacity-30 uppercase tracking-widest text-center">{{ site.site_elements.no_entries_found }}</p>`;
        }

        renderPagination(totalPages, currentPage);
    }

    function renderPagination(totalPages, currentPage) {
        if (totalPages <= 1) {
            paginationNav.innerHTML = '';
            return;
        }

        const params = new URLSearchParams(window.location.search);
        const prevPage = currentPage > 1 ? currentPage - 1 : null;
        const nextPage = currentPage < totalPages ? currentPage + 1 : null;

        const currentFormatted = currentPage < 10 ? `0${currentPage}` : currentPage;
        const totalFormatted = totalPages < 10 ? `0${totalPages}` : totalPages;

        paginationNav.innerHTML = `
            <a href="${prevPage ? '?q=' + getQueryParam('q') + '&page=' + prevPage : '#'}" 
               class="text-sm font-black uppercase tracking-widest hover:line-through ${!prevPage ? 'invisible' : ''}">
               ← Newer
            </a>
            
            <div class="text-sm font-black uppercase tracking-widest tabular-nums">
                Page <span>${currentFormatted}</span> of <span>${totalFormatted}</span>
            </div>
            
            <a href="${nextPage ? '?q=' + getQueryParam('q') + '&page=' + nextPage : '#'}" 
               class="text-sm font-black uppercase tracking-widest hover:line-through ${!nextPage ? 'invisible' : ''}">
               Older →
            </a>
        `;
    }

    renderPosts();
});
</script>

<script>
    const form = document.getElementById('contactForm');
    const statusMsg = document.getElementById('status-msg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerText = "Sending...";
        
        // Show status badge
        statusMsg.classList.remove('hidden', 'border-green-600', 'text-green-600', 'border-red-600', 'text-red-600');
        statusMsg.classList.add('border-black', 'dark:border-white', 'text-black', 'dark:text-white');
        statusMsg.textContent = "Sending your message...";

        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            statusMsg.classList.remove('border-black', 'dark:border-white', 'text-black', 'dark:text-white');
            
            if(data.result === 'success') {
                statusMsg.textContent = "Thank you! Your message was sent successfully.";
                statusMsg.classList.add('border-green-600', 'text-green-600', 'bg-green-50', 'dark:bg-green-950/30');
                form.reset();
            } else {
                statusMsg.textContent = "Error submitting data: " + (data.error || "Unknown error");
                statusMsg.classList.add('border-red-600', 'text-red-600', 'bg-red-50', 'dark:bg-red-950/30');
            }
        })
        .catch(error => {
            statusMsg.classList.remove('border-black', 'dark:border-white', 'text-black', 'dark:text-white');
            statusMsg.textContent = "Submission error. Check web app permissions.";
            statusMsg.classList.add('border-red-600', 'text-red-600', 'bg-red-50', 'dark:bg-red-950/30');
            console.error('Error:', error);
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Send Message";
        });
    });
</script>

    document.addEventListener('DOMContentLoaded', () => {
        // Automatically inject the broken URL into the modal elements
        const brokenUrl = window.location.href;

        document.getElementById('reportDisplayUrl').textContent = brokenUrl;

        // Modal Logic
        const modal = document.getElementById('reportModal');
        const openBtn = document.getElementById('openReportModal');
        const closeBtn = document.getElementById('closeReportModal');
        const cancelBtn = document.getElementById('cancelReportModal');
        const form = document.getElementById('bugReportForm');
        const statusMsg = document.getElementById('bugStatusMsg');
        const submitBtn = document.getElementById('submitBugBtn');

        function openModal() {
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
            form.reset();
            // Re-assign the broken URL after form reset clears it
            document.getElementById('reportInputUrl').value = brokenUrl;
            document.getElementById('reportDisplayUrl').textContent = brokenUrl;
            statusMsg.classList.add('hidden');
        }

        openBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);

        // Close on backdrop click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                closeModal();
            }
        });

        // Form Submission via Fetch
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            statusMsg.className = "text-xs font-bold uppercase tracking-wider p-3 border-2 border-black dark:border-white text-black dark:text-white bg-transparent";
            statusMsg.textContent = "Sending report...";
            statusMsg.classList.remove('hidden');

            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === 'success') {
                    statusMsg.className = "text-xs font-bold uppercase tracking-wider p-3 border-2 border-green-600 text-green-600 bg-green-50 dark:bg-green-950/30";
                    statusMsg.textContent = "Report submitted successfully. Thank you!";
                    form.reset();
                    setTimeout(() => {
                        closeModal();
                    }, 2000);
                } else {
                    throw new Error(data.error || 'Submission failed');
                }
            })
            .catch(err => {
                statusMsg.className = "text-xs font-bold uppercase tracking-wider p-3 border-2 border-red-600 text-red-600 bg-red-50 dark:bg-red-950/30";
                statusMsg.textContent = "Error sending report. Please try again.";
                console.error(err);
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "{{ site.site_elements.submit | default: 'Submit Report' }}";
            });
        });
    });

async function fetchPrayerTimes(city, country, method) {
    const locationDisplay = document.getElementById("prayer-location-display");
    const prayerListEl = document.getElementById("prayer-list");
    
    if (!prayerListEl) return;

    if (locationDisplay) {
        locationDisplay.textContent = `${city}, ${country}`;
    }
    
    prayerListEl.innerHTML = `
        <div class="flex flex-col items-center justify-center p-4 text-xs animate-pulse bg-gray-100 dark:bg-zinc-900 border border-black/10 dark:border-white/10 min-w-[110px] md:min-w-0 col-span-full">
            <span class="text-gray-400 dark:text-zinc-500 font-medium">Loading timings...</span>
            <span class="text-gray-400 dark:text-zinc-500 font-bold">--:--</span>
        </div>
    `;

    const endpoint = `https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}&method=${method}`;

    try {
        const response = await fetch(endpoint);
        const result = await response.json();

        if (result.code === 200) {
            const data = result.data;
            const timings = data.timings;
            
            const dateEl = document.getElementById("prayer-date");
            if (dateEl) dateEl.textContent = data.date.readable;

            const hijri = data.date.hijri;
            const hijriDateEl = document.getElementById("prayer-hijri-date");
            if (hijriDateEl) {
                hijriDateEl.textContent = `${hijri.day} ${hijri.month.en} ${hijri.year} AH`;
            }

            const targetPrayers = [
                { key: "Fajr", label: "Fajr" },
                { key: "Sunrise", label: "Duha" },
                { key: "Dhuhr", label: "Dhuhr" },
                { key: "Asr", label: "Asr" },
                { key: "Maghrib", label: "Maghrib" },
                { key: "Isha", label: "Isha" }
            ];

            prayerListEl.innerHTML = ""; 

            targetPrayers.forEach(prayer => {
                let time12 = formatTimeTo12Hour(timings[prayer.key]);
                const card = document.createElement("div");
                card.className = "flex flex-col items-center justify-center p-4 text-xs font-bold uppercase tracking-wider transition-colors bg-gray-50 dark:bg-zinc-900 hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black border border-black/10 dark:border-white/10 text-center min-w-[110px] flex-shrink-0 md:flex-shrink md:min-w-0 group";
                
                card.innerHTML = `
                    <span class="text-[10px] text-gray-400 dark:text-zinc-500 group-hover:text-gray-300 dark:group-hover:text-zinc-600 mb-1">${prayer.label}</span>
                    <span class="text-black dark:text-white group-hover:text-white dark:group-hover:text-black font-black text-xs sm:text-sm">${time12}</span>
                `;
                prayerListEl.appendChild(card);
            });
        } else {
            prayerListEl.innerHTML = `<p class="text-xs text-red-500 text-center py-2 col-span-full">City not found. Try again.</p>`;
        }
    } catch (error) {
        console.error("Error fetching prayer times:", error);
        prayerListEl.innerHTML = `<p class="text-xs text-red-500 text-center py-2 col-span-full">Network error.</p>`;
    }
}

function formatTimeTo12Hour(timeStr) {
    if (!timeStr) return "";
    let [hours, minutes] = timeStr.split(':');
    let h = parseInt(hours, 10);
    let ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12;
    h = h ? h : 12; 
    return `${h}:${minutes} ${ampm}`;
}

<script>
const pwaBtn = document.getElementById('pwa-control-btn');
let deferredPrompt;

// Function to check if the user is currently using the app version
const isStandalone = () => {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
};

// 1. Initial State Check
if (isStandalone()) {
  // User is already IN the app, so hide the button entirely
  pwaBtn.classList.add('hidden');
}

// 2. Listen for Installability (Not yet installed)
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  
  pwaBtn.innerText = "Install App"; // Set text to Install
  pwaBtn.classList.remove('hidden');
});

// 3. Handle Button Click
pwaBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    // TRIGGER INSTALL
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      deferredPrompt = null;
      pwaBtn.classList.add('hidden');
    }
  } else {
    // FALLBACK: OPEN IN APP
    // If there is no install prompt, but the button is visible,
    // we assume it's installed or they are on a mobile browser.
    // Redirecting to the start_url often triggers the "Open in App" banner.
    window.location.href = '/'; 
  }
});

// 4. Handle successful installation
window.addEventListener('appinstalled', () => {
  pwaBtn.innerText = "Open in App";
  // Optional: hide it after installation to avoid confusion
  pwaBtn.classList.add('hidden'); 
});
</script>

    <script>
        const picker = document.getElementById('gregorianPicker');
        const gregorianOutput = document.getElementById('gregorianOutput');
        const hijriOutput = document.getElementById('hijriOutput');

        // Set default to today's date
        const today = new Date();
        const isoToday = today.toISOString().split('T')[0];
        picker.value = isoToday;
        updateDates(today);

        // Listen for changes when the user picks a date
        picker.addEventListener('change', function(e) {
            if (e.target.value) {
                // Parse local date safely without timezone shifting issues
                const [year, month, day] = e.target.value.split('-').map(Number);
                const selectedDate = new Date(year, month - 1, day);
                updateDates(selectedDate);
            }
        });

        function updateDates(dateObj) {
            // Display Gregorian
            gregorianOutput.textContent = dateObj.toISOString().split('T')[0];

            // Convert and Display Hijri (Umm al-Qura)
            const hijriFormatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });

            const parts = hijriFormatter.formatToParts(dateObj);
            let hYear = '', hMonth = '', hDay = '';

            parts.forEach(part => {
                if (part.type === 'year') hYear = part.value;
                if (part.type === 'month') hMonth = part.value;
                if (part.type === 'day') hDay = part.value;
            });

            hijriOutput.textContent = `${hYear}-${hMonth}-${hDay}`;
        }
    </script>
