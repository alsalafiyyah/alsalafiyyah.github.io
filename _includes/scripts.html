<script>
document.addEventListener("DOMContentLoaded", function () {
    const POSTS_PER_PAGE = 10;
    const urlParams = new URLSearchParams(window.location.search);
    const currentPage = parseInt(urlParams.get("page")) || 1;
    
    const raw = document.getElementById("fatwa-data");
    const data = JSON.parse(raw.textContent);
    
    const totalPages = Math.ceil(data.length / POSTS_PER_PAGE);
    const start = (currentPage - 1) * POSTS_PER_PAGE;
    const end = start + POSTS_PER_PAGE;
    
    const container = document.getElementById("fatwa-container");
    const postsToShow = data.slice(start, end);

    // 1. Render Posts
    if (data.length === 0) {
        container.innerHTML = `
            <div class="py-20 text-center">
                <h2 class="text-4xl md:text-5xl font-black uppercase tracking-tighter opacity-20">
                    {{ site.site_elements.no_entries_found }}
                </h2>
            </div>
        `;
        document.getElementById("pagination-nav").classList.add("hidden");
        return; 
    }

    container.innerHTML = postsToShow.map(post => {
        const postDate = post.hijri ? `${post.hijri} / ${post.date}` : post.date;

        // --- A. VIDEO POST TEMPLATE ---
        if (post.videoID) {
            return `
                <article class="flex flex-col justify-between space-y-4 border-l-2 border-red-500 pl-4 py-1 group cursor-pointer">
                    <div class="space-y-3">
                        <!-- Thumbnail Preview Box -->
                        <div class="relative bg-gray-100 dark:bg-zinc-900 border border-black/10 dark:border-white/10 aspect-video overflow-hidden flex items-center justify-center">
                            <img src="https://img.youtube.com/vi/${post.videoID}/hqdefault.jpg" alt="${post.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
                                <div class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center group-hover:bg-red-500 transition-colors">
                                    <svg viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 ml-0.5">
                                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                    </svg>
                                </div>
                            </div>
                            <span class="absolute bottom-2 right-2 bg-black/80 text-white text-[9px] font-black px-2 py-0.5 uppercase tracking-widest">YouTube</span>
                        </div>

                        <div class="space-y-1">
                            <span class="text-[10px] font-bold opacity-50 block">${postDate}</span>
                            <a href="${post.url}"><h3 class="text-xl md:text-2xl font-black uppercase tracking-tighter serif group-hover:underline leading-snug">
                                ${post.title}
                            </h3></a>
                            <p class="text-xs md:text-sm font-medium leading-relaxed opacity-80">
                                ${post.summary}
                            </p>
                        </div>
                    </div>

                    <div class="pt-2">
                        <a href="${post.url}" class="text-[10px] font-black uppercase tracking-widest text-black dark:text-white flex items-center gap-1 group-hover:text-red-500 transition-colors">
                            Watch Video <span>→</span>
                        </a>
                    </div>
                </article>
            `;
        }

        // --- B. AUDIO POST TEMPLATE ---
        else if (post.audio) {
            return `
                <article class="flex flex-col justify-between space-y-4 border-l-2 border-red-500 pl-4 py-1 group cursor-pointer">
                    <div class="space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold opacity-50">${postDate}</span>
                            <span class="text-[10px] font-black uppercase tracking-widest bg-black/5 dark:bg-white/10 px-2 py-0.5 text-red-500">Audio Stream</span>
                        </div>
                        <a href="${post.url}"><h3 class="text-xl md:text-2xl font-black uppercase tracking-tighter serif group-hover:underline leading-snug">
                            ${post.title}
                        </h3></a>
                        <p class="text-xs md:text-sm font-medium leading-relaxed opacity-80">
                            ${post.summary}
                        </p>
                    </div>
                    <div class="pt-2 flex items-center gap-4">
                        <div x-data="{ playing: false, audio: new Audio('${post.audio}') }">
                            <button 
                                @click="playing ? audio.pause() : audio.play(); playing = !playing"
                                class="flex items-center justify-center w-10 h-10 bg-red-600 hover:bg-red-700 text-white rounded-full shadow-lg transition focus:outline-none"
                                :aria-label="playing ? 'Pause' : 'Play'">
                                <!-- Play Icon -->
                                <svg x-show="!playing" class="w-6 h-6 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                                <!-- Pause Icon -->
                                <svg x-show="playing" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                                </svg>
                            </button>
                        </div>
                        <a href="${post.url}" class="text-[10px] font-black uppercase tracking-widest text-black dark:text-white group-hover:text-red-500 transition-colors">
                            Read more →
                        </a>
                    </div>
                </article>
            `;
        }

        // --- C. TEXT POST TEMPLATE ---
        else {
            return `
                <article class="flex flex-col justify-between space-y-4 border-l-2 border-red-500 pl-4 py-1 group cursor-pointer">
                    <a href="${post.url}" class="space-y-2 block">
                        <span class="text-[10px] font-bold opacity-50 block">${postDate}</span>
                        <a href="${post.url}"><h3 class="text-xl md:text-2xl font-black uppercase tracking-tighter serif group-hover:underline leading-snug">
                            ${post.title}
                        </h3></a>
                        <p class="text-xs md:text-sm font-medium leading-relaxed opacity-80">
                            ${post.summary}
                        </p>
                    </a>
                    <div class="pt-2">
                        <a href="${post.url}" class="text-[10px] font-black uppercase tracking-widest text-black dark:text-white flex items-center gap-1 group-hover:text-red-500 transition-colors">
                            Read More →
                        </a>
                    </div>
                </article>
            `;
        }
    }).join("");

    // 2. Handle Pagination UI
    const prevLink = document.getElementById("prev-link");
    const nextLink = document.getElementById("next-link");
    const currentDisplay = document.getElementById("current-page-display");
    const totalDisplay = document.getElementById("total-pages-display");

    currentDisplay.textContent = currentPage < 10 ? `0${currentPage}` : currentPage;
    totalDisplay.textContent = totalPages < 10 ? `0${totalPages}` : totalPages;

    if (currentPage > 1) {
        prevLink.classList.remove("invisible");
        prevLink.href = `?page=${currentPage - 1}`;
    }

    if (currentPage < totalPages) {
        nextLink.classList.remove("invisible");
        nextLink.href = `?page=${currentPage + 1}`;
    }
});
</script>


{% if page.active == 'search' %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    const allTemplates = Array.from(document.querySelectorAll("#allPosts .post-template"));
    const container = document.getElementById("searchResults");
    const paginationNav = document.getElementById("paginationNav");
    const termDisplay = document.getElementById("search-term-display");
    const countDisplay = document.getElementById("result-count");

    const pageSize = 10; 

    function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name) || "";
    }

    function getUrlPage() {
        const params = new URLSearchParams(window.location.search);
        return parseInt(params.get('page')) || 1;
    }

    function highlightText(text, query) {
        if (!query) return text;
        const regex = new RegExp(`(${query})`, "gi");
        // Using a custom class for the highlight to match theme
        return text.replace(regex, `<mark class="bg-black text-white dark:bg-white dark:text-black p-0.5">$1</mark>`);
    }

    function extractSnippet(content, query, length = 100) {
        const contentLower = content.toLowerCase();
        const queryLower = query.toLowerCase();
        const index = contentLower.indexOf(queryLower);
        if (index === -1) return content.slice(0, length * 2) + "...";

        const start = Math.max(0, index - length);
        const end = Math.min(content.length, index + query.length + length);
        let snippet = content.slice(start, end).trim();
        if (start > 0) snippet = "..." + snippet;
        if (end < content.length) snippet = snippet + "...";
        return highlightText(snippet, query);
    }

    function renderPosts() {
        const query = getQueryParam('q').trim();
        const queryLower = query.toLowerCase();
        termDisplay.innerText = query || "{{ site.site_elements.all_entries }}";

        const filtered = allTemplates.filter(post => {
            const title = post.dataset.title.toLowerCase();
            const content = post.dataset.content.toLowerCase();
            return title.includes(queryLower) || content.includes(queryLower);
        });

        countDisplay.innerText = filtered.length < 10 ? `0${filtered.length}` : filtered.length;

        const totalPages = Math.ceil(filtered.length / pageSize);
        let currentPage = getUrlPage();
        if (currentPage > totalPages) currentPage = totalPages || 1;

        const paginated = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);

        if (paginated.length) {
            container.innerHTML = paginated.map(post => `
                <article class="group py-4 border-b border-gray-100 dark:border-zinc-800 last:border-0">
                    <span class="text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400">
                        ${post.dataset.hijri}
                    </span>
                    <h2 class="text-3xl md:text-4xl font-black mt-2 mb-6 leading-[0.85] uppercase tracking-tighter group-hover:italic transition-all">
                        <a href="${post.dataset.url}">${highlightText(post.dataset.title, query)}</a>
                    </h2>
                    <p class="text-lg text-gray-600 dark:text-zinc-400 leading-relaxed max-w-2xl">
                        ${extractSnippet(post.dataset.content, query)}
                    </p>
                </article>
            `).join('');
        } else {
            container.innerHTML = `<p class="py-20 text-xl font-bold opacity-30 uppercase tracking-widest text-center">{{ site.site_elements.no_entries_found }}</p>`;
        }

        renderPagination(totalPages, currentPage);
    }

    function renderPagination(totalPages, currentPage) {
        if (totalPages <= 1) {
            paginationNav.innerHTML = '';
            return;
        }

        const params = new URLSearchParams(window.location.search);
        const prevPage = currentPage > 1 ? currentPage - 1 : null;
        const nextPage = currentPage < totalPages ? currentPage + 1 : null;

        const currentFormatted = currentPage < 10 ? `0${currentPage}` : currentPage;
        const totalFormatted = totalPages < 10 ? `0${totalPages}` : totalPages;

        paginationNav.innerHTML = `
            <a href="${prevPage ? '?q=' + getQueryParam('q') + '&page=' + prevPage : '#'}" 
               class="text-sm font-black uppercase tracking-widest hover:line-through ${!prevPage ? 'invisible' : ''}">
               ← Newer
            </a>
            
            <div class="text-sm font-black uppercase tracking-widest tabular-nums">
                Page <span>${currentFormatted}</span> of <span>${totalFormatted}</span>
            </div>
            
            <a href="${nextPage ? '?q=' + getQueryParam('q') + '&page=' + nextPage : '#'}" 
               class="text-sm font-black uppercase tracking-widest hover:line-through ${!nextPage ? 'invisible' : ''}">
               Older →
            </a>
        `;
    }

    renderPosts();
});
</script>
{% endif %}

<script>
    const form = document.getElementById('contactForm');
    const statusMsg = document.getElementById('status-msg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerText = "Sending...";
        
        // Show status badge
        statusMsg.classList.remove('hidden', 'border-green-600', 'text-green-600', 'border-red-600', 'text-red-600');
        statusMsg.classList.add('border-black', 'dark:border-white', 'text-black', 'dark:text-white');
        statusMsg.textContent = "Sending your message...";

        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            statusMsg.classList.remove('border-black', 'dark:border-white', 'text-black', 'dark:text-white');
            
            if(data.result === 'success') {
                statusMsg.textContent = "Thank you! Your message was sent successfully.";
                statusMsg.classList.add('border-green-600', 'text-green-600', 'bg-green-50', 'dark:bg-green-950/30');
                form.reset();
            } else {
                statusMsg.textContent = "Error submitting data: " + (data.error || "Unknown error");
                statusMsg.classList.add('border-red-600', 'text-red-600', 'bg-red-50', 'dark:bg-red-950/30');
            }
        })
        .catch(error => {
            statusMsg.classList.remove('border-black', 'dark:border-white', 'text-black', 'dark:text-white');
            statusMsg.textContent = "Submission error. Check web app permissions.";
            statusMsg.classList.add('border-red-600', 'text-red-600', 'bg-red-50', 'dark:bg-red-950/30');
            console.error('Error:', error);
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Send Message";
        });
    });
</script>

document.addEventListener("DOMContentLoaded", () => {
    // --- 1. Dark / Light Theme Toggle Logic ---
    const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
    const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
    const themeToggleBtn = document.getElementById('theme-toggle');

    if (themeToggleDarkIcon && themeToggleLightIcon && themeToggleBtn) {
        if (document.documentElement.classList.contains('dark')) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });
    }

    // --- 2. Tabs Logic ---
    const container = document.getElementById("fatwa-tabs-container");
    if (container) {
        const buttons = container.querySelectorAll(".tab-btn");
        const panels = container.querySelectorAll(".tab-panel");
        buttons.forEach(btn => {
            btn.addEventListener("click", () => {
                const targetTab = btn.getAttribute("data-tab");
                buttons.forEach(b => {
                    b.classList.remove("text-black", "dark:text-white", "border-b-2", "border-red-500", "dark:border-white");
                    b.classList.add("text-gray-400");
                });
                btn.classList.remove("text-gray-400");
                btn.classList.add("text-black", "dark:text-white", "border-b-2", "border-red-500", "dark:border-white");
                panels.forEach(panel => {
                    if (panel.id === `panel-${targetTab}`) {
                        panel.classList.remove("hidden");
                    } else {
                        panel.classList.add("hidden");
                    }
                });
            });
        });
    }

    // --- 3. Category Scroll Logic ---
    const catContainer = document.getElementById("category-scroll-container");
    const catLeftBtn = document.getElementById("cat-scroll-left");
    const catRightBtn = document.getElementById("cat-scroll-right");

    if (catContainer && catLeftBtn && catRightBtn) {
        const scrollAmount = 320;
        catLeftBtn.addEventListener("click", () => {
            catContainer.scrollBy({ left: -scrollAmount, behavior: "smooth" });
        });
        catRightBtn.addEventListener("click", () => {
            catContainer.scrollBy({ left: scrollAmount, behavior: "smooth" });
        });
    }

    // --- 4. Quotes Scroll Logic ---
    const quoteContainer = document.getElementById("quote-scroll-container");
    const quoteLeftBtn = document.getElementById("quote-scroll-left");
    const quoteRightBtn = document.getElementById("quote-scroll-right");

    if (quoteContainer && quoteLeftBtn && quoteRightBtn) {
        const scrollAmount = 350;
        quoteLeftBtn.addEventListener("click", () => {
            quoteContainer.scrollBy({ left: -scrollAmount, behavior: "smooth" });
        });
        quoteRightBtn.addEventListener("click", () => {
            quoteContainer.scrollBy({ left: scrollAmount, behavior: "smooth" });
        });
    }

    // --- 5. Marquee / Header Scroll Logic ---
    const logoScrollContainer = document.getElementById("logo-scroll-container");
    const scrollLeftBtn = document.getElementById("scroll-left");
    const scrollRightBtn = document.getElementById("scroll-right");

    if (logoScrollContainer && scrollLeftBtn && scrollRightBtn) {
        const scrollAmount = 300; 
        scrollLeftBtn.addEventListener("click", () => {
            logoScrollContainer.scrollBy({ left: -scrollAmount, behavior: "smooth" });
        });
        scrollRightBtn.addEventListener("click", () => {
            logoScrollContainer.scrollBy({ left: scrollAmount, behavior: "smooth" });
        });
    }

    // --- 6. Image Modal Logic ---
    const openBtn = document.getElementById("open-modal-btn");
    const closeBtn = document.getElementById("close-modal-btn");
    const modal = document.getElementById("image-modal");

    if (openBtn && modal && closeBtn) {
        openBtn.addEventListener("click", () => {
            modal.classList.remove("hidden");
            document.body.style.overflow = "hidden";
        });
        const closeModal = () => {
            modal.classList.add("hidden");
            document.body.style.overflow = "auto";
        };
        closeBtn.addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeModal();
        });
    }

    // --- 7. Show More / Show Less Text Toggle Logic ---
    const toggleBtn = document.getElementById("toggle-text-btn");
    const textPreview = document.getElementById("text-preview");
    const textFull = document.getElementById("text-full");

    if (toggleBtn && textPreview && textFull) {
        toggleBtn.addEventListener("click", () => {
            const isHidden = textFull.classList.contains("hidden");
            if (isHidden) {
                textFull.classList.remove("hidden");
                textPreview.classList.add("hidden");
                toggleBtn.textContent = "Show Less ↑";
            } else {
                textFull.classList.add("hidden");
                textPreview.classList.remove("hidden");
                toggleBtn.textContent = "Show More ↓";
            }
        });
    }

    // --- 8. Bug Report Modal & Fetch Form Submission Logic ---
    const brokenUrl = window.location.href;
    const reportInputUrl = document.getElementById('reportInputUrl');
    const reportDisplayUrl = document.getElementById('reportDisplayUrl');

    if (reportInputUrl && reportDisplayUrl) {
        reportInputUrl.value = brokenUrl;
        reportDisplayUrl.textContent = brokenUrl;
    }

    const reportModal = document.getElementById('reportModal');
    const openReportBtn = document.getElementById('openReportModal');
    const closeReportBtn = document.getElementById('closeReportModal');
    const cancelReportBtn = document.getElementById('cancelReportModal');
    const bugForm = document.getElementById('bugReportForm');
    const bugStatusMsg = document.getElementById('bugStatusMsg');
    const submitBugBtn = document.getElementById('submitBugBtn');

    if (reportModal && openReportBtn && bugForm) {
        function openReportModal() {
            reportModal.classList.remove('hidden');
        }

        function closeReportModal() {
            reportModal.classList.add('hidden');
            bugForm.reset();
            if (reportInputUrl && reportDisplayUrl) {
                reportInputUrl.value = brokenUrl;
                reportDisplayUrl.textContent = brokenUrl;
            }
            if (bugStatusMsg) bugStatusMsg.classList.add('hidden');
        }

        openReportBtn.addEventListener('click', openReportModal);
        if (closeReportBtn) closeReportBtn.addEventListener('click', closeReportModal);
        if (cancelReportBtn) cancelReportBtn.addEventListener('click', closeReportModal);

        reportModal.addEventListener('click', (e) => {
            if (e.target === reportModal) closeReportModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !reportModal.classList.contains('hidden')) {
                closeReportModal();
            }
        });

        bugForm.addEventListener('submit', function(e) {
            e.preventDefault();

            if (submitBugBtn) {
                submitBugBtn.disabled = true;
                submitBugBtn.innerText = "Submitting...";
            }

            if (bugStatusMsg) {
                bugStatusMsg.className = "text-xs font-bold uppercase tracking-wider p-3 border-2 border-black dark:border-white text-black dark:text-white bg-transparent";
                bugStatusMsg.textContent = "Sending report...";
                bugStatusMsg.classList.remove('hidden');
            }

            const formData = new FormData(bugForm);

            fetch(bugForm.action, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === 'success') {
                    if (bugStatusMsg) {
                        bugStatusMsg.className = "text-xs font-bold uppercase tracking-wider p-3 border-2 border-green-600 text-green-600 bg-green-50 dark:bg-green-950/30";
                        bugStatusMsg.textContent = "Report submitted successfully. Thank you!";
                    }
                    bugForm.reset();
                    setTimeout(() => {
                        closeReportModal();
                    }, 2000);
                } else {
                    throw new Error(data.error || 'Submission failed');
                }
            })
            .catch(err => {
                if (bugStatusMsg) {
                    bugStatusMsg.className = "text-xs font-bold uppercase tracking-wider p-3 border-2 border-red-600 text-red-600 bg-red-50 dark:bg-red-950/30";
                    bugStatusMsg.textContent = "Error sending report. Please try again.";
                }
                console.error(err);
            })
            .finally(() => {
                if (submitBugBtn) {
                    submitBugBtn.disabled = false;
                    submitBugBtn.innerText = "{{ site.site_elements.submit | default: 'Submit Report' }}";
                }
            });
        });
    }
});
</script>
